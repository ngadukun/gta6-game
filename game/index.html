<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1420">
<meta name="description" content="Sunhaven — an original open-world crime caper that runs from static files in a desktop browser. Steal cars, run jobs for Marisol Vega, and dodge the Sunhaven Police Department.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffd166'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232e8fa3'/%3E%3C/svg%3E">
<title>Sunhaven — an open-world crime caper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the heading and the status line. */
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<h1 class="visually-hidden">Sunhaven — an open-world crime caper</h1>
<canvas id="game" aria-label="Sunhaven: explore the city on foot and by car, run missions, and dodge the Sunhaven Police Department"></canvas>
<p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
<noscript><p style="color:#f4f1de;font-family:system-ui,sans-serif;padding:2rem">Sunhaven needs JavaScript — the whole city is drawn and driven by it.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
